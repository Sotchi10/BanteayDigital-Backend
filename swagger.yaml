openapi: 3.0.3
info:
  title: BanteayDigital API
  version: 3.0.0
  description: |
    Users privately scan suspicious content, explicitly request moderation, and
    administrators separately publish sanitized community safety alerts. The current
    scan engine is deterministic; Qdrant retrieval and grounded AI extend this scan contract.
servers:
  - url: http://localhost:3000
tags:
  - name: System
  - name: Authentication
  - name: Scans
  - name: Reports
  - name: Admin Reports
  - name: Admin Detection Rules
  - name: Community Posts
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  schemas:
    ScanInput:
      type: object
      required: [inputType, value]
      properties:
        inputType: { type: string, enum: [TEXT, URL] }
        value: { type: string, minLength: 1, maxLength: 10000 }
    ImageScanInput:
      type: object
      required: [inputType, image]
      properties:
        inputType: { type: string, enum: [IMAGE] }
        image: { type: string, format: binary, description: PNG, JPG, JPEG, or WEBP; maximum 10 MB. }
    Scan:
      type: object
      required: [id, inputType, rawInput, normalizedInput, findings, assessment, score, createdAt]
      properties:
        id: { type: string }
        inputType: { type: string, enum: [TEXT, URL, IMAGE] }
        imageStoragePath:
          type: string
          nullable: true
          description: Private Supabase Storage object path; present only for IMAGE scans.
        imageMimeType: { type: string, nullable: true, example: image/png }
        imageSize: { type: integer, nullable: true, minimum: 0 }
        rawInput: { type: string }
        normalizedInput: { type: string }
        findings: { type: array, items: { type: object } }
        assessment:
          type: string
          description: No warning signs is not a guarantee that content is safe.
          enum: [NO_STRONG_WARNING_SIGNS, INSUFFICIENT_EVIDENCE, CAUTION, SUSPICIOUS, STRONG_SCAM_INDICATORS, UNABLE_TO_ASSESS]
        score: { type: integer, minimum: 0 }
        analysisSummary: { type: string, nullable: true }
        matchedScamCases: { type: array, items: { type: object } }
        recommendations: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    ReportFromScanInput:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
    ReviewInput:
      type: object
      properties:
        reviewNote: { type: string, nullable: true, minLength: 1, maxLength: 2000 }
    PublishInput:
      type: object
      required: [title, summary, content]
      description: Sanitized public content supplied by an administrator; never raw private evidence.
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
        summary: { type: string, minLength: 10, maxLength: 500 }
        content: { type: string, minLength: 10, maxLength: 50000 }
    DetectionRuleInput:
      type: object
      required: [code, title, description, severity, weight, matchTerms, languages, source]
      properties:
        code: { type: string, example: PARCEL_FEE_SCAM }
        title: { type: string, example: Parcel fee scam }
        description: { type: string, example: A delivery fee is requested before a parcel can be released. }
        severity: { type: string, enum: [CAUTION, SUSPICIOUS] }
        weight: { type: integer, minimum: 1, maximum: 50 }
        matchTerms: { type: array, items: { type: string }, example: [customs fee, parcel is held] }
        languages: { type: array, items: { type: string }, example: [en, km] }
        recommendation: { type: string, nullable: true }
        source: { type: string }
        verified: { type: boolean }
        enabled: { type: boolean }
    Error:
      type: object
      required: [message]
      properties: { message: { type: string }, details: { type: object } }
  responses:
    BadRequest: { description: Invalid request data. }
    Unauthorized: { description: Authentication is required or invalid. }
    Forbidden: { description: Administrator permission is required. }
    NotFound: { description: Resource not found. }
    Conflict: { description: Action conflicts with resource state. }
paths:
  /api/health:
    get:
      tags: [System]
      summary: Check API health
      responses: { '200': { description: API is healthy. } }
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register and start an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                email: { type: string, format: email }
                phoneNumber: { type: string }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses: { '201': { description: Registered and authenticated. }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Start an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                email: { type: string, format: email }
                phoneNumber: { type: string }
                password: { type: string }
      responses: { '200': { description: Authenticated. }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: Get the authenticated user
      responses: { '200': { description: User found. }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      summary: End the current session
      responses: { '200': { description: Logged out. }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/scans:
    post:
      tags: [Scans]
      security: [{ bearerAuth: [] }]
      summary: Privately scan text, a URL, or an image
      description: |
        Choose one input type. Send TEXT or URL as JSON. Send IMAGE as
        multipart/form-data with an `image` file; its OCR text follows the same
        deterministic, retrieval, and AI-analysis flow as TEXT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanInput' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImageScanInput' }
      responses:
        '201':
          description: Scan completed.
          content:
            application/json:
              schema:
                type: object
                required: [scan]
                properties:
                  scan: { $ref: '#/components/schemas/Scan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Image exceeds the 10 MB upload limit. }
        '415': { description: IMAGE input must be PNG, JPG, JPEG, or WEBP. }
        '422': { description: Image OCR failed or no readable text was found. }
        '503': { description: AI OCR, retrieval, or analysis service is unavailable. }
  /api/v1/scans/{id}:
    get:
      tags: [Scans]
      security: [{ bearerAuth: [] }]
      summary: Get the current user's private scan result
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Scan found. }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/scans/{id}/report:
    post:
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      summary: Explicitly submit a private scan for moderator review
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ReportFromScanInput' } } } }
      responses: { '201': { description: Private report created. }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/reports:
    get:
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      summary: List the current user's reports
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Reports found. }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/reports/{id}:
    get:
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      summary: Get one of the current user's reports
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Report found. }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/admin/reports:
    get:
      tags: [Admin Reports]
      security: [{ bearerAuth: [] }]
      summary: List reports for moderation
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Reports found. }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/admin/detection-rules:
    get:
      tags: [Admin Detection Rules]
      security: [{ bearerAuth: [] }]
      summary: List administrator-managed text detection rules
      responses: { '200': { description: Rules found. }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [Admin Detection Rules]
      security: [{ bearerAuth: [] }]
      summary: Create a text detection rule
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DetectionRuleInput' } } } }
      responses: { '201': { description: Rule created. }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/detection-rules/{id}:
    patch:
      tags: [Admin Detection Rules]
      security: [{ bearerAuth: [] }]
      summary: Update, enable, or disable a text detection rule
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DetectionRuleInput' } } } }
      responses: { '200': { description: Rule updated. }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/reports/{id}/approve:
    patch:
      tags: [Admin Reports]
      security: [{ bearerAuth: [] }]
      summary: Approve a report without publishing it
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ReviewInput' } } } }
      responses: { '200': { description: Report approved. }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/reports/{id}/reject:
    patch:
      tags: [Admin Reports]
      security: [{ bearerAuth: [] }]
      summary: Reject a report
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ReviewInput' } } } }
      responses: { '200': { description: Report rejected. }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/admin/reports/{id}/publish:
    post:
      tags: [Admin Reports]
      security: [{ bearerAuth: [] }]
      summary: Publish sanitized content from an approved report
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishInput' } } }
      responses: { '201': { description: Community post published. }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/community/posts:
    get:
      tags: [Community Posts]
      summary: List published community alerts
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Community posts found. } }
  /api/v1/community/posts/{id}:
    get:
      tags: [Community Posts]
      summary: Get one published community alert
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Community post found. }, '404': { $ref: '#/components/responses/NotFound' } }
